<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            background-color: #f4f4f4;
        }
        .container {
            width: 80%;
            margin: auto;
            padding: 20px;
            background: white;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            border-radius: 10px;
        }
        img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin-top: 20px;
        }
        h1, h2 {
            color: #333;
        }
        p {
            color: #666;
        }
        .section {
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="profile.jpg" alt="Profile Picture">
        <h1>Your Name</h1>
        <p>Web Developer | Designer | Programmer</p>
        
        <div class="section">
            <h2>About Me</h2>
            <p>A brief description about yourself and your work.</p>
        </div>

        <div class="section">
            <h2>Skills</h2>
            <p>HTML, CSS, JavaScript, React, etc.</p>
        </div>

        <div class="section">
            <h2>Projects</h2>
            <p>Links to some of your best projects.</p>
        </div>

        <div class="section">
            <h2>Contact</h2>
            <p>Email: your.email@example.com</p>
        </div>
    </div>
</body>
</html>
